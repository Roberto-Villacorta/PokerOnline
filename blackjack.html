<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackjack 21 Online | Club de Casino</title>
    <meta name="description" content="Juega al Blackjack 21 tradicional contra el crupier. Baraja de 52 cartas, pago 3:2 y reglas clásicas de casino.">
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Favicon SVG con As de Picas -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠</text></svg>">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="top-bar">
        <div class="brand" id="brandLogo" style="cursor: pointer;" title="Ir al Menú Principal de Juegos" onclick="window.location.href='index.html'">
            <span class="brand-suit">♠</span>
            <div class="brand-text-block">
                <span class="brand-title">CLUB DE CASINO</span>
                <span class="brand-subtitle">BLACKJACK 21 CLÁSICO</span>
            </div>
        </div>

        <div class="top-controls">
            <!-- Botón Volver al Menú Principal -->
            <a href="index.html" id="btnSelectGame" class="icon-btn" title="Menú Principal (Cambiar de Juego)" aria-label="Menú Principal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </a>

            <!-- Botón Sonido -->
            <button id="btnSound" class="icon-btn" title="Activar/Desactivar sonido" aria-label="Sonido">
                <svg id="soundIconOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="soundIconOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>

            <!-- Botón Salir -->
            <a href="index.html" class="icon-btn" title="Salir al Menú Principal" aria-label="Salir">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </header>

    <!-- TAPETE Y VISTA DE BLACKJACK 21 -->
    <main class="game-viewport">
        <div class="blackjack-table-wrap" id="blackjackViewport" style="display: flex;">
            <div class="poker-table-outer bj-table-outer">
                <div class="poker-felt bj-felt">
                    <div class="felt-texture-overlay"></div>
                    <div class="felt-bet-line bj-bet-line"></div>
                    <div class="felt-watermark">BLACKJACK 21 • PAGA 3:2 • CRUPIER SE PLANTA EN 17</div>

                    <!-- BANCA Y APUESTA DE BLACKJACK -->
                    <div class="bj-chips-hud">
                        <div class="bj-chip-badge">
                            <span class="bj-chip-label">BANCA:</span>
                            <span id="bjBankrollDisplay" class="bj-chip-val">$1,000</span>
                        </div>
                        <div class="bj-chip-badge">
                            <span class="bj-chip-label">APUESTA:</span>
                            <span id="bjCurrentBetDisplay" class="bj-chip-val">$50</span>
                        </div>
                    </div>

                    <!-- ZONA CRUPIER -->
                    <div class="bj-zone bj-dealer-zone">
                        <div class="bj-player-header">
                            <span class="bj-player-title">CRUPIER</span>
                            <span id="bjDealerPoints" class="bj-points-badge">Puntos: ?</span>
                        </div>
                        <div class="bj-cards-container" id="bjDealerCards"></div>
                    </div>

                    <!-- BANNER RESULTADO BLACKJACK -->
                    <div id="bjResultBanner" class="bj-result-banner" style="display: none;">
                        <div id="bjResultMessage" class="bj-result-message">Blackjack - Has ganado</div>
                    </div>

                    <!-- ZONA JUGADOR -->
                    <div class="bj-zone bj-player-zone">
                        <div class="bj-player-header">
                            <span class="bj-player-title">TUS CARTAS</span>
                            <span id="bjPlayerPoints" class="bj-points-badge">Puntos: 0</span>
                        </div>
                        <div class="bj-cards-container" id="bjPlayerCards"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- PANEL INFERIOR DE ACCIONES -->
    <footer class="action-bar-wrap">
        <div id="blackjackActionBar" class="bj-action-bar-content" style="display: flex;">
            <div class="bj-status-info">
                <span class="bj-status-label">Modo Blackjack (Paga 3:2):</span>
                <span id="bjTurnText" class="bj-status-val">Tu turno (Pide carta o plántate)</span>
            </div>

            <div class="bj-bet-selector">
                <span class="bj-status-label">Fichas:</span>
                <div class="presets-row">
                    <button class="preset-btn btn-bj-bet" data-amount="10">$10</button>
                    <button class="preset-btn btn-bj-bet" data-amount="25">$25</button>
                    <button class="preset-btn btn-bj-bet active" data-amount="50">$50</button>
                    <button class="preset-btn btn-bj-bet" data-amount="100">$100</button>
                    <button class="preset-btn btn-bj-bet" data-amount="500">$500</button>
                </div>
            </div>

            <div class="action-controls bj-action-controls">
                <button id="btnBjHit" class="btn-action btn-bj-hit">
                    <span class="main-label">IR (C)</span>
                    <span class="sub-label">Pedir Carta</span>
                </button>

                <button id="btnBjStand" class="btn-action btn-bj-stand">
                    <span class="main-label">PLANTARSE (V)</span>
                    <span class="sub-label">Quedarse</span>
                </button>

                <button id="btnBjNewGame" class="btn-action btn-bj-new">
                    <span class="main-label">NUEVA MANO</span>
                    <span class="sub-label">Espacio</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- CONTENEDOR TOAST PARA NOTIFICACIONES -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- SCRIPTS -->
    <script src="js/audio.js?v=1.0.1"></script>
    <script src="js/blackjack.js?v=1.0.1"></script>

</body>
</html>
