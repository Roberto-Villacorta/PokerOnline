<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas | Club de Casino</title>
    <!-- Estilos de navegación de la web y estilos originales del Buscaminas -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="BuscaMinasJS-main/minas.css">
</head>

<body>

    <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
    <header class="top-bar" style="width: 100%;">
        <div class="brand" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <span class="brand-suit">♠</span>
            <div class="brand-text-block">
                <span class="brand-title">CLUB DE CASINO</span>
                <span class="brand-subtitle">BUSCAMINAS (MODO RECREATIVO)</span>
            </div>
        </div>

        <div class="top-controls">
            <!-- Botón Volver al Menú Principal -->
            <a href="index.html" class="icon-btn" title="Volver al Menú Principal" aria-label="Menú Principal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </a>

            <!-- Botón Salir -->
            <a href="index.html" class="icon-btn" title="Salir al Menú Principal" aria-label="Salir">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </header>

    <!-- CONTENEDOR ORIGINAL DEL BUSCAMINAS -->
    <div class="buscaminas">
        <h1>Buscaminas</h1>
        <button id="btnReiniciar" class="btn-reiniciar-buscaminas" type="button">Reiniciar Partida</button>
        <div id="cronometro">Tiempo: 0 s</div>
        <p id="mensaje"></p>
        <div id="tablero"></div>

        <!-- AUTORÍA A MRALDEV -->
        <div class="creditos-buscaminas">
            Juego Buscaminas proporcionado por <a href="https://github.com/mraldev" target="_blank"
                rel="noopener noreferrer">@mraldev</a> (GitHub)
        </div>
    </div>

    <script src="BuscaMinasJS-main/minas.js"></script>

</body>

</html>
